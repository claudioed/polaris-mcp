name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --quiet ruff
      - name: Lint and check formatting
        run: |
          set -euo pipefail
          ruff check src tests scripts
          ruff format --check src tests scripts

  test:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev tools
        run: python -m pip install --quiet -e '.[dev]'
      - name: Unit tests with coverage gate
        run: |
          set -euo pipefail
          pytest --cov=polaris_mcp --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    needs: [package]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean venv and exercise stdio
        run: |
          set -euo pipefail
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install --quiet --upgrade pip
          .smoke-venv/bin/pip install --quiet dist/polaris_mcp-*.whl
          .smoke-venv/bin/polaris-mcp --help
          .smoke-venv/bin/python scripts/smoke_stdio.py

  vuln:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit installed dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet . pip-audit
          pip freeze | grep -vi 'polaris[-_]mcp' > requirements-audit.txt
          pip-audit --strict -r requirements-audit.txt

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, package, smoke, vuln]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compute next patch version
        id: version
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Build distributions
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build
          python -m build
      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Install from the attached wheel or sdist: `pip install polaris_mcp-${{ steps.version.outputs.version }}.whl`
          files: dist/*

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release]
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build
          python -m build
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
