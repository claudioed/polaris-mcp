[project]
name = "polaris-mcp"
version = "0.1.0"
description = "MCP server for the Polaris architectural fitness-function control plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "proprietary" }
authors = [{ name = "Polaris maintainers" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "platformdirs>=4",
]

[project.scripts]
polaris-mcp = "polaris_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=6",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
